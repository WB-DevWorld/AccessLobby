# This is the only public path to Keycloak. Dokploy targets this service,
# while the Keycloak container stays off the shared proxy network.
server {
    listen 8080;
    server_tokens off;

    location / { return 404; }

    location ^~ /realms/accesslobby-first-party/ {
        # Explicit URI makes NGINX forward its normalized path, not the raw
        # client URI that could contain encoded traversal segments.
        proxy_pass http://iam:8080/realms/accesslobby-first-party/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    location ^~ /resources/ {
        proxy_pass http://iam:8080/resources/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}
