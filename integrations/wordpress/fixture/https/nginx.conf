worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    map $arg_rest_route $fixture_route {
        default $uri;
        ~*^(?:/accesslobby/v1/backchannel-logout|%2faccesslobby%2fv1%2fbackchannel-logout)$ /accesslobby/v1/backchannel-logout;
    }
    log_format fixture '$request_method $fixture_route $status';
    access_log off;
    server_tokens off;
    client_max_body_size 8m;
    ssl_certificate /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 8443 ssl default_server;
        server_name _;
        return 421;
    }

    server {
        listen 8443 ssl;
        server_name a.alwp.test;
        root /var/www/a;
        index index.php;
        access_log /fixture-logs/wordpress-a.log fixture;
        location / {
            try_files $uri $uri/ /index.php?$args;
        }
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 8443;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass php:9000;
        }
    }

    server {
        listen 8443 ssl;
        server_name b.alwp.test;
        root /var/www/b;
        index index.php;
        access_log /fixture-logs/wordpress-b.log fixture;
        location = /gh { return 301 /gh/; }
        location /gh/ {
            try_files $uri $uri/ /gh/index.php?$args;
        }
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 8443;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass php:9000;
        }
    }

    server {
        listen 8443 ssl;
        server_name auth.alwp.test;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $keycloak_upstream http://keycloak:8080;
        location / {
            proxy_pass $keycloak_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    server {
        listen 8443 ssl;
        server_name api.alwp.test;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api;
        location / {
            proxy_pass http://$api_backend:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
