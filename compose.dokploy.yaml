# Dokploy Compose service; configure HTTPS domains in Dokploy's Domains tab.
# Keep Isolated Deployment off. Dokploy attaches only domain targets to its
# shared proxy network; route IAM through the restricted gateway, never `iam`.
# No host ports are published.
# Use a separate Dokploy service/project, secrets and volumes for each environment.
services:
  iam-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:?}
    volumes: [iam_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      retries: 10

  identity-db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: accesslobby
      POSTGRES_USER: accesslobby
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
    volumes: [identity_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesslobby -d accesslobby"]
      interval: 10s
      retries: 10

  iam:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://iam-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IAM_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IAM_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IAM_ADMIN_PASSWORD:?}
      KC_HOSTNAME: ${IAM_PUBLIC_ORIGIN:?}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes: ["../files/keycloak-import:/opt/keycloak/data/import:ro"]
    expose: ["8080"]
    networks: [backend, iam-edge]
    depends_on:
      iam-db: { condition: service_healthy }

  iam-gateway:
    image: ${IAM_GATEWAY_IMAGE:?pin qualified image digest}
    restart: unless-stopped
    expose: ["8080"]
    networks: [iam-edge]
    depends_on:
      iam: { condition: service_started }

  migrate:
    image: ${API_IMAGE:?pin qualified image digest}
    restart: "no"
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://accesslobby:${IDENTITY_DB_PASSWORD:?}@identity-db:5432/accesslobby
    networks: [backend]
    depends_on:
      identity-db: { condition: service_healthy }

  api:
    image: ${API_IMAGE:?pin qualified image digest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://accesslobby:${IDENTITY_DB_PASSWORD:?}@identity-db:5432/accesslobby
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_API_AUDIENCE: accesslobby-api
      ALLOWED_CLIENT_IDS: ${ALLOWED_CLIENT_IDS:?}
      GIT_SHA: ${GIT_SHA:?}
    expose: ["3001"]
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      iam: { condition: service_started }

  web:
    image: ${WEB_IMAGE:?pin qualified image digest}
    restart: unless-stopped
    environment:
      WEB_BASE_URL: ${WEB_BASE_URL:?}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_CLIENT_ID: accesslobby-web
      SESSION_SECRET: ${SESSION_SECRET:?}
      API_INTERNAL_URL: http://api:3001
    expose: ["3000"]
    networks: [backend]
    depends_on:
      api: { condition: service_started }

networks:
  backend:
    internal: true
  iam-edge:
    internal: true
volumes:
  iam_data:
  identity_data:
