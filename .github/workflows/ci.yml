name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: accesslobby
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: accesslobby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accesslobby -d accesslobby"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://accesslobby:test-only-password@127.0.0.1:5432/accesslobby
      TEST_DATABASE_URL: postgres://accesslobby:test-only-password@127.0.0.1:5432/accesslobby
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pnpm
        run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @accesslobby/api migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check forbidden source material and secrets
        run: |
          forbidden=$(git ls-files | grep -Ei '(^|/)(project_sources|evidence|generated)/|\.env($|\.)|\.dump$|source.pack|conversation.archive' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$forbidden" ]; then
            echo 'Forbidden source material or environment file tracked'; exit 1
          fi
      - name: Container builds
        run: |
          docker build -f apps/api/Dockerfile -t accesslobby-api:ci .
          docker build -f apps/web/Dockerfile -t accesslobby-web:ci .
  iam-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render local realm and start IAM
        env:
          WEB_BASE_URL: http://localhost:3000
        run: |
          python3 infra/scripts/render-realm.py
          password=$(openssl rand -hex 32)
          docker run -d --name accesslobby-ci-iam -p 127.0.0.1:8080:8080 \
            -v "$PWD/infra/keycloak/generated:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$password" \
            quay.io/keycloak/keycloak:26.7.4 start-dev --import-realm
      - name: Verify discovery and JWKS
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/realms/accesslobby-first-party/.well-known/openid-configuration -o /tmp/discovery.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json, urllib.request
          doc = json.load(open('/tmp/discovery.json'))
          assert doc['issuer'] == 'http://localhost:8080/realms/accesslobby-first-party'
          keys = json.load(urllib.request.urlopen(doc['jwks_uri']))['keys']
          assert keys and any(key['kty'] == 'RSA' for key in keys)
          print('Exact issuer and signing keys verified')
          PY
