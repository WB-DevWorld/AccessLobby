name: Publish immutable images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      iam_gateway_digest: ${{ steps.iam_gateway.outputs.digest }}
      consumer_digest: ${{ steps.consumer.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-api:sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-web:sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        id: iam_gateway
        with:
          context: .
          file: infra/iam-gateway/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-iam-gateway:sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        id: consumer
        with:
          context: .
          file: examples/reference-consumer/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-reference-consumer:sha-${{ github.event.workflow_run.head_sha }}
      - name: Record immutable image references
        run: |
          echo "API: ghcr.io/wb-devworld/accesslobby-api@${{ steps.api.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: ghcr.io/wb-devworld/accesslobby-web@${{ steps.web.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "IAM gateway: ghcr.io/wb-devworld/accesslobby-iam-gateway@${{ steps.iam_gateway.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reference consumer: ghcr.io/wb-devworld/accesslobby-reference-consumer@${{ steps.consumer.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
