name: Publish immutable images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-api:sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-web:sha-${{ github.sha }}
      - name: Record immutable image references
        run: |
          echo "API: ghcr.io/wb-devworld/accesslobby-api@${{ steps.api.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: ghcr.io/wb-devworld/accesslobby-web@${{ steps.web.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
