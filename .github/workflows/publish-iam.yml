name: Publish immutable IAM image
on:
  workflow_run:
    workflows: [Keycloak theme]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  iam-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: iam
        with:
          context: .
          file: infra/keycloak/Dockerfile
          push: true
          tags: ghcr.io/wb-devworld/accesslobby-iam:sha-${{ github.event.workflow_run.head_sha }}
      - name: Record immutable IAM image reference
        run: |
          echo "IAM: ghcr.io/wb-devworld/accesslobby-iam@${{ steps.iam.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
